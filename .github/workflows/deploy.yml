name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocs-static-i18n

      - name: Sync console web client from fmruby-core
        # Released code only: main carries what the 2.1.0 firmware was built from.
        env:
          FMRUBY_CORE_REF: main
        run: bash scripts/sync-console.sh

      - name: Build
        run: mkdocs build

      # Fails the deploy on a link to a page that is not there, or to a heading
      # that is not there. The second kind is the one mkdocs does not report,
      # and the one the Japanese pages keep acquiring (their anchors are the
      # Japanese headings, so an English one copied across matches nothing).
      - name: Check internal links
        run: ruby scripts/check_links.rb site

      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --force
