site_name: Family mruby project
site_description: Family mruby project documentation
site_author: kishima
site_url: https://family-mruby.github.io/

theme:
  favicon: assets/favicon.ico
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            Architecture: アーキテクチャ
            Getting Started: 基本的な使い方
            Choose your hardware: 機種の選択
            Modern (M5Stack Tab5): Modern (M5Stack Tab5)
            Setup (Retro): 起動まで (Retro)
            For BOOTH Buyers: BOOTHで購入した方へ
            Setup: 起動まで
            The Desktop: デスクトップ
            Hello World: Hello World
            Connecting to Wi-Fi: WiFi につなぐ
            Simulator: シミュレータ
            Console: コンソール
            Family mruby Console: Family mruby コンソール
            Default Apps: 標準アプリ
            Firmware Update: ファームウェア更新
            API Reference: API リファレンス
            Overview: 一覧
            Application: アプリ
            Drawing: 描画
            Sprites: スプライト
            Tile Maps: タイルマップ
            Processing-style Drawing: Processing 風の描画
            Sound: 音声
            MIDI: MIDI
            Network: ネットワーク
            Inter-App Messaging: アプリ間通信
            Files & I/O: ファイル・I/O
            Logging: ログ
            Hardware Control: ハードウェア制御
            Utilities: ユーティリティ
            Constants & System Info: 定数・システム情報
            Tasks & Timing: タスク・時間
            File Formats: ファイル形式
            System Config (system_conf.toml / wifi.toml): システム設定 (system_conf.toml / wifi.toml)
            App Config (.app.toml): アプリ設定ファイル (.app.toml)
            HID Device Config (hid_devices.toml): HID 機器設定 (hid_devices.toml)
            Audio File Formats: 音声ファイルフォーマット
            Image & Icon Files: 画像・アイコンファイル
            Tools: 開発ツール
            Remote Desktop: 遠隔画面
            Debugging: デバッグ
            BASIC and MicroPython: BASIC と MicroPython
            Limitations: 制約事項
            Examples: サンプル集
            Hardware: ハードウェア
            Verified Peripherals: 動作確認済み機器

